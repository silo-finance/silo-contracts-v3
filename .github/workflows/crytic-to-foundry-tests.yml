name: CryticToFoundry

on:
    push:
        branches: [ master, develop ]
        paths:
            - '**/*.sol'
            - '.github/workflows/crytic-to-foundry-tests.yml'
            - '.gitmodules'
            - 'gitmodules/**'
            - 'silo-core/deploy/input/anvil/**'
            - 'silo-core/deploy/input/irmConfigs/**'

    pull_request:
        paths:
            - '**/*.sol'
            - '.github/workflows/crytic-to-foundry-tests.yml'
            - '.gitmodules'
            - 'gitmodules/**'
            - 'silo-core/deploy/input/anvil/**'
            - 'silo-core/deploy/input/irmConfigs/**'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-ref-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
    CryticToFoundryDefaulting:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            -   uses: actions/checkout@v5
                with:
                    fetch-depth: 0
                    ref: ${{ github.head_ref || github.ref_name }}
                    token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
                    submodules: recursive

            -   name: Install Foundry
                uses: foundry-rs/foundry-toolchain@v1

            -   name: Build silo foundry utils
                working-directory: ./gitmodules/silo-foundry-utils
                run: |
                    cargo build --release
                    cp target/release/silo-foundry-utils ../../silo-foundry-utils
                    ../../silo-foundry-utils --version

            -   name: Run CryticToFoundryDefaulting tests
                run: FOUNDRY_PROFILE=echidna_defaulting forge test --mc CryticToFoundryDefaulting --ffi -vv

            -   name: Run CryticToFoundryHookV3 tests
                run: FOUNDRY_PROFILE=echidna_hookV3 forge test --mc CryticToFoundryHookV3 --ffi -vv

            -   name: Run CryticToFoundry (Invariants) tests
                run: FOUNDRY_PROFILE=core-with-invariants forge test --mc CryticToFoundry --ffi -vv

            -   name: Run CryticToFoundryLeverage tests
                run: FOUNDRY_PROFILE=echidna_leverage forge test --mc CryticToFoundryLeverage --ffi -vv

            -   name: Run CryticToFoundry (x-silo) tests
                run: FOUNDRY_PROFILE=x_silo_echidna forge test --mc CryticToFoundry --ffi -vv

            -   name: Sync IErrors file
                run: python3 scripts/sync_ierrors_ci.py --commit-on-pr

            -   name: Read IErrors sync summary
                id: summary
                run: |
                    echo "new_errors_count=$(jq '.new_errors_count' ierrors_sync_summary.json)" >> "$GITHUB_OUTPUT"

            -   name: Comment new custom errors on PR
                if: github.event_name == 'pull_request' && steps.summary.outputs.new_errors_count != '0'
                uses: marocchino/sticky-pull-request-comment@v2
                with:
                    header: ierrors-sync
                    path: ierrors_comment.md
