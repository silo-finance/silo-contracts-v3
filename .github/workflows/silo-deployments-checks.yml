# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Deployments compatibility checks 

env:
    RPC_MAINNET: ${{ secrets.RPC_MAINNET }}
    RPC_ARBITRUM: ${{ secrets.RPC_ARBITRUM }}
    RPC_OPTIMISM: ${{ secrets.RPC_OPTIMISM }}
    RPC_ANVIL: ${{ secrets.RPC_ANVIL }}
    RPC_SONIC: ${{ secrets.RPC_SONIC }}
    RPC_AVALANCHE: ${{ secrets.RPC_AVALANCHE }}
    RPC_INJECTIVE: ${{ secrets.RPC_INJECTIVE }}
    RPC_XDC: ${{ secrets.RPC_XDC }}
    RPC_MANTLE: ${{ secrets.RPC_MANTLE }}
    RPC_MEGAETH: ${{ secrets.RPC_MEGAETH }}
    PRIVATE_KEY: ${{ secrets.ANVIL_PRIVATE_KEY }}
    VERIFIER_URL_SONIC: ${{ secrets.VERIFIER_URL_SONIC }}
    VERIFIER_API_KEY_SONIC: ${{ secrets.VERIFIER_API_KEY_SONIC }}
    AGGREGATOR: "1INCH" # because it is available on all blockchains

on:
    push:
        branches: [ master ]
        paths:
            - silo-core/**/*.sol
            - silo-core/**/*.ts
            - silo-core/**/*.js
            - silo-core/deployments/**/*.json
            - silo-oracles/**/*.sol
            - silo-oracles/**/*.ts
            - silo-oracles/**/*.js
            - silo-oracles/deployments/**/*.json
            - gitmodules/*
            - .gitmodules
            - .github/workflows/silo-deployments-checks.yml

    pull_request:
        branches: [ master ]
        types: [ ready_for_review ]
        paths:
            - silo-core/**/*.sol
            - silo-core/**/*.ts
            - silo-core/**/*.js
            - silo-core/deployments/**/*.json
            - silo-oracles/**/*.sol
            - silo-oracles/**/*.ts
            - silo-oracles/**/*.js
            - silo-oracles/deployments/**/*.json
            - gitmodules/*
            - .gitmodules
            - .github/workflows/silo-deployments-checks.yml

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-ref-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
    checks:
        strategy:
            matrix:
                match-contract: [
                    SiloLensCompatibilityTest,
                    BackwardsCompatibleGaugeLikeTest
               ]

        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            -   uses: actions/checkout@v5
                with:
                    fetch-depth: 0
                    ref: ${{ github.head_ref || github.ref_name }}
                    token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
                
            # Cache all git submodules (large gitmodules/* tree and .git/modules) to speed up CI.
            # Keyed only by .gitmodules so cache can be reused across commits; git will fetch deltas if submodule refs change.
            -   name: Cache git submodules
                uses: actions/cache@v4
                with:
                    path: |
                        gitmodules
                        .git/modules
                    key: gitmodules-v1-${{ hashFiles('.gitmodules') }}
                    restore-keys: |
                        gitmodules-v1-

            -   name: Init git submodules (uses cached clones when available)
                run: |
                    git submodule sync --recursive
                    git submodule update --init --recursive

            -   name: Install Foundry
                uses: foundry-rs/foundry-toolchain@v1
                with:
                    version: v1.4.4

            -   name: Build silo foundry utils
                working-directory: ./gitmodules/silo-foundry-utils
                run: |
                    cargo build --release
                    cp target/release/silo-foundry-utils ../../silo-foundry-utils
                    ../../silo-foundry-utils --version

            -   name: ${{ matrix.match-contract }}
                run: FOUNDRY_PROFILE=core_test forge test --no-match-test "_skip_" --mc ${{ matrix.match-contract }} --ffi -vv

            -   name: Sync IErrors file
                if: matrix.match-contract == 'BackwardsCompatibleGaugeLikeTest'
                run: python3 scripts/sync_ierrors_ci.py --commit-on-pr

            -   name: Read IErrors sync summary
                if: matrix.match-contract == 'BackwardsCompatibleGaugeLikeTest'
                id: summary
                run: |
                    echo "new_errors_count=$(jq '.new_errors_count' ierrors_sync_summary.json)" >> "$GITHUB_OUTPUT"

            -   name: Comment new custom errors on PR
                if: matrix.match-contract == 'BackwardsCompatibleGaugeLikeTest' && github.event_name == 'pull_request' && steps.summary.outputs.new_errors_count != '0'
                uses: marocchino/sticky-pull-request-comment@v2
                with:
                    header: ierrors-sync
                    path: ierrors_comment.md
